<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wardah Beauty - Produk</title>

     <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Menghubungkan library SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    
    <!-- Header dan navigasi utama -->
    <header>
        <div class="logo">WARDAH</div>

        <nav>
            <a href="index.html">Beranda</a>
            <a href="produk.html" class="active"> Produk</a>
            <a href="tentang.html">Tentang</a>
            <a href="kontak.html">Kontak</a>
        </nav>

        <!-- Tombol untuk melihat keranjang -->
        <button class="cart-button" id="cartButton">
            🛒 Keranjang
        </button>
    </header>

    <main>

        <!-- Judul halaman produk -->
        <section class="page-title">
            <p class="subtitle">OUR PRODUCTS</p>
            <h1>Produk Wardah</h1>
            <p>
                Pilih produk skincare dan makeup favoritmu.
            </p>
        </section>

        <!-- Bagian pencarian dan filter produk -->
        <section class="product-section">

            <!-- Kolom pencarian produk -->
            <div class="search-box">
                <input 
                type="text" 
                id="searchInput"
                placeholder="🔍Cari produk..."
                aria-label="Cari produk"
                >
            </div>

            <!-- Tombol untuk menyaring produk berdasarkan kategori -->
            <div class="filter">
                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="semua">
                    Semua
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="skincare">
                    Skincare
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="makeup">
                    Makeup
                </button>
            </div>

             <!-- Menampilkan jumlah produk -->
            <p id="jumlahProduk" class="jumlah-produk"></p>
                
            <!-- Tempat menampilkan daftar produk -->
            <div id="productList" class="product-list"></div>
            
            <!-- Pesan jika produk tidak ditemukan -->
            <p id="produkKosong" class="produk-kosong">
                Produk tidak ditemukan.
            </p>

        </section>
    
    </main>

    <!-- Footer halaman -->
    <footer>
        <p>© 2026 Wardah Beauty Website</p>
    </footer>

    <!-- Menghubungkan file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
